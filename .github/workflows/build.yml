name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck, lint, unit + e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  desktop:
    name: Desktop — ${{ matrix.os }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libudev-dev pkg-config cmake libpipewire-0.3-dev libxdo-dev libgbm-dev libdbus-1-dev \
            libfuse2t64
      - run: npm ci
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Speech pipeline on real audio (Silero VAD v6.2 + Parakeet)
        working-directory: src-tauri
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -sSL -o "$RUNNER_TEMP/models/parakeet-unified-en-0.6b-Q8_0.gguf" \
            "https://huggingface.co/handy-computer/parakeet-unified-en-0.6b-gguf/resolve/843b1b175ace04f5a89d379c79e2518c0d065b25/parakeet-unified-en-0.6b-Q8_0.gguf"
          echo "4b50b6dd862bf6e346929aaf4f5eaacec003bfa3f56462d6c874b41ef2f38795  $RUNNER_TEMP/models/parakeet-unified-en-0.6b-Q8_0.gguf" | sha256sum -c -
          PRMPTR_TEST_MODELS="$RUNNER_TEMP/models" cargo test --test real_audio
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          # linuxdeploy ships as an AppImage; run it without FUSE on runners.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          args: --bundles ${{ runner.os == 'Windows' && 'nsis,msi' || 'appimage,deb' }}
      - uses: actions/upload-artifact@v4
        with:
          name: prmptr-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
