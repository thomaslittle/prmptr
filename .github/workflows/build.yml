name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Needed by the tag job that uploads installers to the GitHub release.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web — typecheck, lint, unit + e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  desktop:
    name: Desktop — ${{ matrix.os }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libudev-dev pkg-config cmake libpipewire-0.3-dev libxdo-dev libgbm-dev libdbus-1-dev \
            libfuse2t64 rpm
      - run: npm ci
      - name: Refresh the sherpa-rs runtime download
        # rust-cache restores the compiled sherpa-rs-sys output but not its
        # downloaded runtime directory, so the cached build script never
        # re-fetches cargs.lib and the test link fails. Force a rebuild.
        working-directory: src-tauri
        run: cargo clean -p sherpa-rs-sys
      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Speech pipeline on real audio (Silero VAD v6.2 + Parakeet)
        working-directory: src-tauri
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -sSL -o "$RUNNER_TEMP/models/parakeet-unified-en-0.6b-Q8_0.gguf" \
            "https://huggingface.co/handy-computer/parakeet-unified-en-0.6b-gguf/resolve/843b1b175ace04f5a89d379c79e2518c0d065b25/parakeet-unified-en-0.6b-Q8_0.gguf"
          echo "4b50b6dd862bf6e346929aaf4f5eaacec003bfa3f56462d6c874b41ef2f38795  $RUNNER_TEMP/models/parakeet-unified-en-0.6b-Q8_0.gguf" | sha256sum -c -
          PRMPTR_TEST_MODELS="$RUNNER_TEMP/models" cargo test --test real_audio
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        with:
          # AppImage bundling needs FUSE/linuxdeploy, which GitHub's
          # containers do not provide reliably; ship .deb and .rpm instead.
          args: --bundles ${{ runner.os == 'Windows' && 'nsis,msi' || 'deb,rpm' }}
      - name: Verify Linux package runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(mktemp -d)
          dpkg-deb -x src-tauri/target/release/bundle/deb/*.deb "$pkg"
          missing=$(ldd "$pkg/usr/bin/prmptr" | grep "not found" || true)
          if [ -n "$missing" ]; then
            echo "$missing" >&2
            exit 1
          fi
          rpm -qpl src-tauri/target/release/bundle/rpm/*.rpm | grep -q "libsherpa-onnx-c-api.so"
          echo "Linux packages resolve libsherpa-onnx-c-api.so"
      - name: Attach installers to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No bundles were produced" >&2
            exit 1
          fi
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "PRMPTR ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: prmptr-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
