name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libudev-dev pkg-config cmake
      - name: Download bundled models
        run: |
          cd src-tauri/models
          curl -L -o ggml-tiny.en.bin "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin"
      - name: Build frontend
        run: npm ci && npm run build
      - name: Build Linux binary
        run: cargo build --release
        working-directory: src-tauri
      - name: Bundle (AppImage + deb)
        run: |
          cargo install tauri-cli --version ^2 --locked
          cd src-tauri && cargo tauri build --no-bundle 2>/dev/null || true
          # Use tauri-cli for proper bundling
          npx tauri build --no-build 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build frontend
        run: npm ci && npm run build
      - name: Build Windows binary (no CUDA — CPU-only portable)
        run: cargo build --release
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: windows-cpu-build
          path: src-tauri/target/release/prmptr.exe
