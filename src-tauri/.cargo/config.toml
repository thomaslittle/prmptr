# Build-time environment for native deps.
#
# One C runtime for the whole process: the dynamic *release* CRT (/MD), which
# is also what sherpa-onnx's prebuilt ONNX Runtime DLLs use. Without this,
# CMake builds transcribe.cpp's Debug configuration (/MDd) in `cargo build` /
# `tauri dev`, and memory crossing between the debug and release CRT heaps
# trips `_CrtIsValidHeapPointer` the moment a model runs. (Same fix hex uses;
# it pins the static runtime because it ships no ONNX DLLs.)
#
# transcribe-cpp-sys reads CMAKE_ARGS. The Vulkan shader subset keeps the
# optional `vulkan` build small: every catalog model is f32/f16/q8_0.
#
# CMAKE_CUDA_FLAGS: CCCL (CUDA 13) hard-errors under cl.exe's legacy
# preprocessor; `/Zc:preprocessor` opts into the conforming one (`cuda`
# feature only).

[env]
CMAKE_ARGS = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DGGML_VULKAN_SHADER_TYPES=f32,f16,q8_0 -DGGML_VULKAN_MUL_MAT_ID=OFF"
CMAKE_CUDA_FLAGS = "-Xcompiler=-fPIC -Xcompiler=/Zc:preprocessor"

# Packages put the sherpa/ONNX shared libraries in /usr/lib/PRMPTR; find them
# relative to the executable without needing LD_LIBRARY_PATH or ldconfig.
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "link-arg=-Wl,-rpath,$ORIGIN/../lib/PRMPTR:$ORIGIN"]
