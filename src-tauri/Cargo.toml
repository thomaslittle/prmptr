[package]
name = "prmptr"
version = "0.1.0"
description = "Real-time AI audio assistant with local transcription"
license = "MIT"
repository = "https://github.com/thomaslittle/prmptr"
authors = ["thomaslittle"]
edition = "2021"

[lib]
name = "prmptr_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# NVIDIA CUDA GPU acceleration for whisper.cpp inference.
# Requires: CUDA toolkit, CMake, MSVC/nvcc.
# Enable with: cargo build --features cuda
[features]
default = []
cuda = ["whisper-rs/cuda"]
# Moonshine Voice is intentionally opt-in until its native packaging path has
# retained Windows/macOS/Linux build evidence. The wrapper is pinned to one
# exact Git revision so API/ABI changes cannot silently enter PRMPTR.
moonshine-voice = ["dep:moonshine-rs", "dep:crc32c"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
tauri-plugin-mcp-bridge = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["stream", "json", "native-tls"] }
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
zip = "2"
flate2 = "1"
tar = "0.4"
cpal = "0.15"
rubato = "0.16.2"
whisper-rs = "0.15.1"
whisper-rs-sys = "0.14.1"
sherpa-rs = { version = "0.6", default-features = false, features = ["download-binaries", "tts"] }
libc = "0.2"
open = "5"
url = "2"
base64 = "0.22"
crc32c = { version = "0.6", optional = true }
moonshine-rs = { git = "https://github.com/ghchinoy/moonshine-rs", rev = "887c89f641d9bf8469099aa1e1f21c65ed72d24d", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "8.0.1", features = ["macos_13_0"] }
